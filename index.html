<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>To-Do</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, sans-serif;
      background: #f5f5f3;
      color: #1a1a1a;
      min-height: 100vh;
      padding: 2rem 1rem;
    }

    .container {
      max-width: 600px;
      margin: 0 auto;
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 600;
      margin-bottom: 1.5rem;
    }

    .form-card {
      background: #fff;
      border: 0.5px solid #ddd;
      border-radius: 12px;
      padding: 1.25rem;
      margin-bottom: 1.25rem;
    }

    .form-row {
      display: flex;
      gap: 8px;
      margin-bottom: 8px;
    }

    input[type="text"], select {
      font-family: inherit;
      font-size: 14px;
      padding: 8px 12px;
      border: 0.5px solid #ccc;
      border-radius: 8px;
      background: #fff;
      color: #1a1a1a;
      outline: none;
      transition: border-color 0.15s;
    }

    input[type="text"]:focus, select:focus {
      border-color: #888;
    }

    input[type="text"].task-input {
      flex: 1;
    }

    select.tag-select {
      width: 140px;
    }

    button.add-btn {
      font-family: inherit;
      font-size: 14px;
      padding: 8px 16px;
      background: #1a1a1a;
      color: #fff;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      white-space: nowrap;
      transition: opacity 0.15s;
    }

    button.add-btn:hover { opacity: 0.8; }

    .error {
      font-size: 13px;
      color: #c0392b;
      margin-top: 4px;
      min-height: 18px;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      margin-bottom: 1rem;
    }

    .filter-btn {
      font-family: inherit;
      font-size: 13px;
      padding: 5px 12px;
      border: 0.5px solid #ccc;
      border-radius: 20px;
      background: #fff;
      color: #555;
      cursor: pointer;
      transition: all 0.15s;
    }

    .filter-btn.active {
      background: #1a1a1a;
      color: #fff;
      border-color: #1a1a1a;
    }

    .tag-filter {
      font-family: inherit;
      font-size: 13px;
      padding: 5px 10px;
      border: 0.5px solid #ccc;
      border-radius: 20px;
      background: #fff;
      color: #555;
      cursor: pointer;
      outline: none;
    }

    .counter {
      font-size: 13px;
      color: #888;
      margin-left: auto;
    }

    .task-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .task-item {
      background: #fff;
      border: 0.5px solid #ddd;
      border-radius: 10px;
      padding: 12px 14px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .task-item.done .task-text {
      text-decoration: line-through;
      color: #aaa;
    }

    .task-check {
      width: 18px;
      height: 18px;
      cursor: pointer;
      accent-color: #1a1a1a;
      flex-shrink: 0;
    }

    .task-text {
      flex: 1;
      font-size: 14px;
    }

    .task-tag {
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 20px;
      background: #f0ede8;
      color: #666;
      flex-shrink: 0;
    }

    .delete-btn {
      background: none;
      border: none;
      cursor: pointer;
      font-size: 16px;
      color: #bbb;
      padding: 0 2px;
      line-height: 1;
      flex-shrink: 0;
      transition: color 0.15s;
    }

    .delete-btn:hover { color: #c0392b; }

    .empty {
      text-align: center;
      font-size: 14px;
      color: #aaa;
      padding: 2rem 0;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>To-Do</h1>

    <div class="form-card">
      <div class="form-row">
        <input type="text" class="task-input" id="taskInput" placeholder="Add a task..." />
        <select class="tag-select" id="tagSelect">
          <option value="">No tag</option>
          <option value="school">School</option>
          <option value="work">Work</option>
          <option value="personal">Personal</option>
        </select>
        <button class="add-btn" id="addBtn">Add</button>
      </div>
      <div class="error" id="errorMsg"></div>
    </div>

    <div class="controls">
      <button class="filter-btn active" data-status="all">All</button>
      <button class="filter-btn" data-status="active">Active</button>
      <button class="filter-btn" data-status="completed">Completed</button>
      <select class="tag-filter" id="tagFilter">
        <option value="">All tags</option>
        <option value="school">School</option>
        <option value="work">Work</option>
        <option value="personal">Personal</option>
      </select>
      <span class="counter" id="counter"></span>
    </div>

    <div class="task-list" id="taskList"></div>
  </div>

  <script>
    let tasks = JSON.parse(localStorage.getItem('tasks') || '[]');
    let statusFilter = 'all';
    let tagFilter = '';

    function save() {
      localStorage.setItem('tasks', JSON.stringify(tasks));
    }

    function getFiltered() {
      return tasks.filter(t => {
        const statusOk = statusFilter === 'all' || (statusFilter === 'active' ? !t.done : t.done);
        const tagOk = !tagFilter || t.tag === tagFilter;
        return statusOk && tagOk;
      });
    }

    function render() {
      const list = document.getElementById('taskList');
      const filtered = getFiltered();
      const activeCount = tasks.filter(t => !t.done).length;

      document.getElementById('counter').textContent =
        activeCount === 1 ? '1 active task' : `${activeCount} active tasks`;

      if (filtered.length === 0) {
        list.innerHTML = '<div class="empty">No tasks here.</div>';
        return;
      }

      list.innerHTML = filtered.map(t => `
        <div class="task-item${t.done ? ' done' : ''}" data-id="${t.id}">
          <input type="checkbox" class="task-check" ${t.done ? 'checked' : ''} data-action="toggle" />
          <span class="task-text">${t.text}</span>
          ${t.tag ? `<span class="task-tag">${t.tag}</span>` : ''}
          <button class="delete-btn" data-action="delete">&#x2715;</button>
        </div>
      `).join('');
    }

    document.getElementById('addBtn').addEventListener('click', () => {
      const input = document.getElementById('taskInput');
      const tag = document.getElementById('tagSelect').value;
      const text = input.value.trim();
      const error = document.getElementById('errorMsg');

      if (!text) {
        error.textContent = 'Task name cannot be blank.';
        return;
      }

      error.textContent = '';
      tasks.push({ id: Date.now(), text, tag, done: false });
      save();
      render();
      input.value = '';
      document.getElementById('tagSelect').value = '';
    });

    document.getElementById('taskInput').addEventListener('keydown', e => {
      if (e.key === 'Enter') document.getElementById('addBtn').click();
    });

    document.querySelectorAll('.filter-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        statusFilter = btn.dataset.status;
        render();
      });
    });

    document.getElementById('tagFilter').addEventListener('change', e => {
      tagFilter = e.target.value;
      render();
    });

    document.getElementById('taskList').addEventListener('click', e => {
      const item = e.target.closest('[data-id]');
      if (!item) return;
      const id = Number(item.dataset.id);

      if (e.target.dataset.action === 'toggle') {
        tasks = tasks.map(t => t.id === id ? { ...t, done: !t.done } : t);
        save();
        render();
      }

      if (e.target.dataset.action === 'delete') {
        tasks = tasks.filter(t => t.id !== id);
        save();
        render();
      }
    });

    render();
  </script>
</body>
</html>
